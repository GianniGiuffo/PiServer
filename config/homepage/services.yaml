- Sistema:
    - Server:
        id: system-server
        widget:
          type: customapi
          url: http://monitoring-api:8080/server
          refreshInterval: 5000
          mappings:
            - field: cpu_percent
              label: CPU
              format: percent
            - field: memory_percent
              label: Memoria
              format: percent
            - field: temperature_c
              label: Temperatura
              format: float
              suffix: " °C"
            - field: uptime_seconds
              label: Uptime
              format: duration
    - NAS:
        id: system-nas
        widget:
          type: customapi
          url: http://monitoring-api:8080/nas
          refreshInterval: 10000
          mappings:
            - field: status
              label: Stato
            - field: free_bytes
              label: Liberi
              format: bytes
            - field: total_bytes
              label: Totali
              format: bytes
            - field: used_percent
              label: Utilizzo
              format: percent
    - Rete:
        id: system-network
        widget:
          type: customapi
          url: http://monitoring-api:8080/network
          refreshInterval: 5000
          mappings:
            - field: interface
              label: Interfaccia
            - field: rx_bps
              label: Entrata
              format: bitrate
            - field: tx_bps
              label: Uscita
              format: bitrate
    - Raspberry:
        id: system-raspberry
        href: https://{{HOMEPAGE_VAR_RACK_PI_FQDN}}/
        widget:
          type: customapi
          url: http://monitoring-api:8080/raspberry
          refreshInterval: 15000
          mappings:
            - field: status
              label: Stato
            - field: services
              label: Servizi
            - field: last_backup_age
              label: Ultimo backup
            - field: ups_charge_percent
              label: UPS
              format: percent

