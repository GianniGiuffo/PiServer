name: raspberry-server

# Core services. This file never stores user media and can start even when the
# network storage mounted at MEDIA_DIR is unavailable.
services:
  caddy:
    image: ${CADDY_IMAGE:?Set CADDY_IMAGE in .env}
    restart: unless-stopped
    mem_limit: 256m
    environment:
      SITE_1_DOMAIN: ${SITE_1_DOMAIN:?Set SITE_1_DOMAIN in .env}
      SITE_2_DOMAIN: ${SITE_2_DOMAIN:-unused.invalid}
      VAULTWARDEN_DOMAIN: ${VAULTWARDEN_DOMAIN:?Set VAULTWARDEN_DOMAIN in .env}
      NEXTCLOUD_PUBLIC_DOMAIN: ${NEXTCLOUD_PUBLIC_DOMAIN:?Set NEXTCLOUD_PUBLIC_DOMAIN in .env}
      NAVIDROME_PUBLIC_DOMAIN: ${NAVIDROME_PUBLIC_DOMAIN:?Set NAVIDROME_PUBLIC_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR:?Set DATA_DIR in .env}/caddy/data:/data
      - ${DATA_DIR:?Set DATA_DIR in .env}/caddy/config:/config
      - ${SITES_DIR:?Set SITES_DIR in .env}:/srv/sites:ro
    ports:
      # Private Hugo pages are published only through Tailscale Serve.
      - "127.0.0.1:8083:8083/tcp"
      # Full Nextcloud UI for Tailscale Serve; the public vhost remains
      # independently restricted to tokenized share routes in Caddy.
      - "127.0.0.1:18084:8084/tcp"
    networks:
      - web
      # Caddy reaches Nextcloud only through its existing restricted frontend
      # network. Databases and the AI connector remain isolated.
      - nextcloud-access
    security_opt:
      - no-new-privileges:true

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:?Set CLOUDFLARED_IMAGE in .env}
    restart: unless-stopped
    mem_limit: 192m
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - caddy
    networks:
      - web
    security_opt:
      - no-new-privileges:true

  pihole:
    image: ${PIHOLE_IMAGE:?Set PIHOLE_IMAGE in .env}
    restart: unless-stopped
    mem_limit: 512m
    ports:
      # Reachable on the LAN and on the host's Tailscale address. Never forward
      # port 53 on the router.
      - "53:53/tcp"
      - "53:53/udp"
      - "127.0.0.1:8081:80/tcp"
    environment:
      TZ: ${TZ:-Europe/Rome}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:?Set PIHOLE_PASSWORD in .env}
      FTLCONF_webserver_api_app_sudo: "true"
      FTLCONF_dns_listeningMode: ALL
      FTLCONF_dns_upstreams: 9.9.9.9;149.112.112.112
    volumes:
      - ${DATA_DIR:?Set DATA_DIR in .env}/pihole:/etc/pihole
    networks:
      - web
    security_opt:
      - no-new-privileges:true

  vaultwarden:
    image: ${VAULTWARDEN_IMAGE:?Set VAULTWARDEN_IMAGE in .env}
    restart: unless-stopped
    mem_limit: 512m
    environment:
      DOMAIN: https://${VAULTWARDEN_DOMAIN:?Set VAULTWARDEN_DOMAIN in .env}
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED:-false}
      WEBSOCKET_ENABLED: "true"
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN:?Set VAULTWARDEN_ADMIN_TOKEN in .env}
    volumes:
      - ${DATA_DIR:?Set DATA_DIR in .env}/vaultwarden:/data
    ports:
      # Loopback health check used during migration; public clients use Caddy.
      - "127.0.0.1:8080:80/tcp"
    networks:
      - web
    security_opt:
      - no-new-privileges:true

  # Homepage never receives the Docker socket directly. The proxy below only
  # permits selected read-only API endpoints and rejects every POST request.
  docker-socket-proxy:
    image: ${DOCKER_SOCKET_PROXY_IMAGE:?Set DOCKER_SOCKET_PROXY_IMAGE in .env}
    restart: unless-stopped
    mem_limit: 64m
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      INFO: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true

  # Minimal read-only API for the four compact system bands in Homepage.
  # It reads selected host counters and Restic timestamps without receiving
  # Docker/systemd sockets and without publishing a host port.
  monitoring-api:
    image: ${MONITORING_API_IMAGE:?Set MONITORING_API_IMAGE in .env}
    restart: unless-stopped
    mem_limit: 64m
    user: "65534:65534"
    command:
      - python
      - /app/monitoring-api.py
    environment:
      NETWORK_INTERFACE: ${SERVER_NETWORK_INTERFACE:-auto}
      MEDIA_MOUNTPOINT: ${MEDIA_DIR:?Set MEDIA_DIR in .env}
      MEDIA_STATUS_FILE: /status/media.json
      BACKUP_STATUS_FILE: /status/backup.json
      RACK_PI_STATUS_URL: https://${RACK_PI_TAILSCALE_FQDN:?Set RACK_PI_TAILSCALE_FQDN in .env}:8456
    volumes:
      - ./scripts/monitoring-api.py:/app/monitoring-api.py:ro
      - /proc/stat:/host/proc/stat:ro
      - /proc/meminfo:/host/proc/meminfo:ro
      - /proc/uptime:/host/proc/uptime:ro
      - /proc/net/dev:/host/proc/net/dev:ro
      - /proc/1/mounts:/host/proc/mounts:ro
      - /sys:/host/sys:ro
      - ${DATA_DIR:?Set DATA_DIR in .env}/monitoring:/status:ro
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - monitoring
      - web
    extra_hosts:
      - "${RACK_PI_TAILSCALE_FQDN}:${RACK_PI_TAILSCALE_IP:?Set RACK_PI_TAILSCALE_IP in .env}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  homepage:
    image: ${HOMEPAGE_IMAGE:?Set HOMEPAGE_IMAGE in .env}
    restart: unless-stopped
    mem_limit: 256m
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${TAILSCALE_FQDN:?Set TAILSCALE_FQDN in .env}
      HOMEPAGE_VAR_TAILSCALE_FQDN: ${TAILSCALE_FQDN}
      HOMEPAGE_VAR_RACK_PI_FQDN: ${RACK_PI_TAILSCALE_FQDN:?Set RACK_PI_TAILSCALE_FQDN in .env}
      HOMEPAGE_VAR_SITE_DOMAIN: ${SITE_1_DOMAIN}
      HOMEPAGE_VAR_VAULTWARDEN_DOMAIN: ${VAULTWARDEN_DOMAIN}
    volumes:
      - ./config/homepage:/app/config:ro
    tmpfs:
      - /app/config/logs
    ports:
      - "127.0.0.1:3000:3000/tcp"
    networks:
      - monitoring
      - web
      - nextcloud-access
    security_opt:
      - no-new-privileges:true

  # Document tools run on the SSD independently of the NAS. Editing documents
  # still requires Nextcloud and its media mount to be available.
  stirling-pdf:
    image: ${STIRLING_PDF_IMAGE:?Set STIRLING_PDF_IMAGE in .env}
    restart: unless-stopped
    mem_limit: 2g
    mem_reservation: 512m
    memswap_limit: 2g
    cpus: 1.0
    cpu_shares: 256
    pids_limit: 256
    environment:
      TZ: ${TZ:-Europe/Rome}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      SECURITY_ENABLELOGIN: "true"
      DISABLE_ADDITIONAL_FEATURES: "false"
      SECURITY_ENABLESELFREGISTRATION: "false"
      SECURITY_INITIALLOGIN_USERNAME: ${STIRLING_ADMIN_USERNAME:-admin}
      SECURITY_INITIALLOGIN_PASSWORD: ${STIRLING_ADMIN_PASSWORD:?Set STIRLING_ADMIN_PASSWORD in .env}
      SYSTEM_DEFAULTLOCALE: it-IT
      SYSTEM_TESSDATADIR: /usr/share/tessdata
      TESSDATA_PREFIX: /usr/share/tessdata
      SYSTEM_ENABLEANALYTICS: "false"
      JAVA_CUSTOM_OPTS: "-Xms128m -Xmx768m -XX:ActiveProcessorCount=1"
      OMP_THREAD_LIMIT: "1"
      PROCESS_EXECUTOR_SESSION_LIMIT_LIBRE_OFFICE_SESSION_LIMIT: "1"
      PROCESS_EXECUTOR_SESSION_LIMIT_TESSERACT_SESSION_LIMIT: "1"
      PROCESS_EXECUTOR_SESSION_LIMIT_GHOSTSCRIPT_SESSION_LIMIT: "1"
      PROCESS_EXECUTOR_SESSION_LIMIT_PYTHON_OPEN_CV_SESSION_LIMIT: "1"
      PROCESS_EXECUTOR_SESSION_LIMIT_IMAGE_MAGICK_SESSION_LIMIT: "1"
      PROCESS_EXECUTOR_SESSION_LIMIT_QPDF_SESSION_LIMIT: "1"
      PROCESS_EXECUTOR_SESSION_LIMIT_OCR_MY_PDF_SESSION_LIMIT: "1"
      PROCESS_EXECUTOR_SESSION_LIMIT_WEASY_PRINT_SESSION_LIMIT: "1"
    volumes:
      - ${DATA_DIR:?Set DATA_DIR in .env}/stirling-pdf/configs:/configs
      - ${DATA_DIR}/stirling-pdf/tessdata:/usr/share/tessdata
      - ${DATA_DIR}/stirling-pdf/pipeline:/pipeline
      - ${DATA_DIR}/stirling-pdf/logs:/logs
    ports:
      - "127.0.0.1:8087:8080/tcp"
    networks:
      - web
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "10", "http://127.0.0.1:8080/api/v1/info/status"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 180s
    security_opt:
      - no-new-privileges:true

  onlyoffice:
    image: ${ONLYOFFICE_IMAGE:?Set ONLYOFFICE_IMAGE in .env}
    restart: unless-stopped
    mem_limit: 4g
    mem_reservation: 1g
    memswap_limit: 4g
    cpus: 1.0
    cpu_shares: 256
    pids_limit: 512
    stop_grace_period: 90s
    environment:
      TZ: ${TZ:-Europe/Rome}
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Set ONLYOFFICE_JWT_SECRET in .env}
      JWT_HEADER: AuthorizationJwt
      # Required for download/callback requests to Nextcloud on the dedicated
      # frontend network; metadata-address access stays disabled.
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "false"
      NGINX_WORKER_PROCESSES: "1"
    volumes:
      - ${DATA_DIR:?Set DATA_DIR in .env}/onlyoffice/data:/var/www/onlyoffice/Data
      - ${DATA_DIR}/onlyoffice/lib:/var/lib/onlyoffice
      - ${DATA_DIR}/onlyoffice/logs:/var/log/onlyoffice
      - ${DATA_DIR}/onlyoffice/postgresql:/var/lib/postgresql
    ports:
      - "127.0.0.1:8088:80/tcp"
    networks:
      - nextcloud-access
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "10", "http://127.0.0.1/healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 180s
    security_opt:
      - no-new-privileges:true

  uptime-kuma:
    image: ${UPTIME_KUMA_IMAGE:?Set UPTIME_KUMA_IMAGE in .env}
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      # Keep Uptime Kuma and its embedded MariaDB on the local SSD: POSIX
      # locking on NFS/SMB is unsafe.
      - ${DATA_DIR:?Set DATA_DIR in .env}/uptime-kuma:/app/data
    ports:
      - "127.0.0.1:3001:3001/tcp"
    extra_hosts:
      # Resolve rack-pi's certificate hostname even though the mini PC does
      # not accept Tailscale DNS configuration.
      - "${RACK_PI_TAILSCALE_FQDN:?Set RACK_PI_TAILSCALE_FQDN in .env}:${RACK_PI_TAILSCALE_IP:?Set RACK_PI_TAILSCALE_IP in .env}"
    networks:
      - web
      - nextcloud-access
    security_opt:
      - no-new-privileges:true

networks:
  web:
  nextcloud-access:
  monitoring:
    internal: true
