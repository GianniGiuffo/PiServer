name: raspberry-server

# Core services. This file never stores user media and can start even when the
# network storage mounted at MEDIA_DIR is unavailable.
services:
  caddy:
    image: ${CADDY_IMAGE:?Set CADDY_IMAGE in .env}
    restart: unless-stopped
    mem_limit: 256m
    environment:
      SITE_1_DOMAIN: ${SITE_1_DOMAIN:?Set SITE_1_DOMAIN in .env}
      SITE_2_DOMAIN: ${SITE_2_DOMAIN:-unused.invalid}
      VAULTWARDEN_DOMAIN: ${VAULTWARDEN_DOMAIN:?Set VAULTWARDEN_DOMAIN in .env}
      N8N_WEBHOOK_DOMAIN: ${N8N_WEBHOOK_DOMAIN:-hooks.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR:?Set DATA_DIR in .env}/caddy/data:/data
      - ${DATA_DIR:?Set DATA_DIR in .env}/caddy/config:/config
      - ${SITES_DIR:?Set SITES_DIR in .env}:/srv/sites:ro
    ports:
      # Private Hugo pages are published only through Tailscale Serve.
      - "127.0.0.1:8083:8083/tcp"
    networks:
      - web
    security_opt:
      - no-new-privileges:true

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:?Set CLOUDFLARED_IMAGE in .env}
    restart: unless-stopped
    mem_limit: 192m
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - caddy
    networks:
      - web
    security_opt:
      - no-new-privileges:true

  pihole:
    image: ${PIHOLE_IMAGE:?Set PIHOLE_IMAGE in .env}
    restart: unless-stopped
    mem_limit: 512m
    ports:
      # Reachable on the LAN and on the host's Tailscale address. Never forward
      # port 53 on the router.
      - "53:53/tcp"
      - "53:53/udp"
      - "127.0.0.1:8081:80/tcp"
    environment:
      TZ: ${TZ:-Europe/Rome}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:?Set PIHOLE_PASSWORD in .env}
      FTLCONF_dns_listeningMode: ALL
      FTLCONF_dns_upstreams: 9.9.9.9;149.112.112.112
    volumes:
      - ${DATA_DIR:?Set DATA_DIR in .env}/pihole:/etc/pihole
    networks:
      - web
    security_opt:
      - no-new-privileges:true

  vaultwarden:
    image: ${VAULTWARDEN_IMAGE:?Set VAULTWARDEN_IMAGE in .env}
    restart: unless-stopped
    mem_limit: 512m
    environment:
      DOMAIN: https://${VAULTWARDEN_DOMAIN:?Set VAULTWARDEN_DOMAIN in .env}
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED:-false}
      WEBSOCKET_ENABLED: "true"
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN:?Set VAULTWARDEN_ADMIN_TOKEN in .env}
    volumes:
      - ${DATA_DIR:?Set DATA_DIR in .env}/vaultwarden:/data
    ports:
      # Loopback health check used during migration; public clients use Caddy.
      - "127.0.0.1:8080:80/tcp"
    networks:
      - web
    security_opt:
      - no-new-privileges:true

  # Homepage never receives the Docker socket directly. The proxy below only
  # permits selected read-only API endpoints and rejects every POST request.
  docker-socket-proxy:
    image: ${DOCKER_SOCKET_PROXY_IMAGE:?Set DOCKER_SOCKET_PROXY_IMAGE in .env}
    restart: unless-stopped
    mem_limit: 64m
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      INFO: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true

  # Host metrics for Homepage. The API has no published port, no Docker socket
  # and no Web UI; only Homepage can reach it on the internal monitoring
  # network. MEDIA_DIR and /sys are read-only.
  glances:
    image: ${GLANCES_IMAGE:?Set GLANCES_IMAGE in .env}
    restart: unless-stopped
    mem_limit: 256m
    environment:
      TZ: ${TZ:-Europe/Rome}
      GLANCES_OPT: >-
        -w --disable-webui -C /etc/glances/glances.conf
        --enable-plugin sensors
        --disable-plugin processlist,containers,ports,folders,amps
    volumes:
      - ./config/glances/glances.conf:/etc/glances/glances.conf:ro
      - /sys:/sys:ro
      - /etc/os-release:/etc/os-release:ro
      - type: bind
        source: ${MEDIA_DIR:?Set MEDIA_DIR in .env}
        target: /srv/media
        read_only: true
        bind:
          create_host_path: false
    networks:
      - monitoring
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:61208/api/4/status', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  homepage:
    image: ${HOMEPAGE_IMAGE:?Set HOMEPAGE_IMAGE in .env}
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      - docker-socket-proxy
      - glances
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${TAILSCALE_FQDN:?Set TAILSCALE_FQDN in .env}
      HOMEPAGE_VAR_TAILSCALE_FQDN: ${TAILSCALE_FQDN}
      HOMEPAGE_VAR_SITE_DOMAIN: ${SITE_1_DOMAIN}
      HOMEPAGE_VAR_VAULTWARDEN_DOMAIN: ${VAULTWARDEN_DOMAIN}
    volumes:
      - ./config/homepage:/app/config:ro
    tmpfs:
      - /app/config/logs
    ports:
      - "127.0.0.1:3000:3000/tcp"
    networks:
      - monitoring
      - web
    security_opt:
      - no-new-privileges:true

  uptime-kuma:
    image: ${UPTIME_KUMA_IMAGE:?Set UPTIME_KUMA_IMAGE in .env}
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      # Keep Uptime Kuma and its embedded MariaDB on the local SSD: POSIX
      # locking on NFS/SMB is unsafe.
      - ${DATA_DIR:?Set DATA_DIR in .env}/uptime-kuma:/app/data
    ports:
      - "127.0.0.1:3001:3001/tcp"
    networks:
      - web
    security_opt:
      - no-new-privileges:true

networks:
  web:
  monitoring:
    internal: true
