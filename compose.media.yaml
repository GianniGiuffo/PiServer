# Services which depend on storage mounted at MEDIA_DIR (temporary USB or NAS).
# Never run this file directly: use media-stack.service or start-stack.sh media.

services:
  nextcloud-postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE in .env}
    restart: on-failure:5
    mem_limit: 768m
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - effective_cache_size=512MB
      - -c
      - maintenance_work_mem=96MB
      - -c
      - max_connections=40
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?Set NEXTCLOUD_DB_PASSWORD in .env}
    volumes:
      - ${DATA_DIR:?Set DATA_DIR in .env}/nextcloud/postgres:/var/lib/postgresql/data
    networks:
      - nextcloud-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  nextcloud-redis:
    image: ${REDIS_IMAGE:?Set REDIS_IMAGE in .env}
    restart: on-failure:5
    mem_limit: 192m
    command: redis-server --appendonly no --maxmemory 128mb --maxmemory-policy noeviction
    networks:
      - nextcloud-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  nextcloud:
    image: ${NEXTCLOUD_IMAGE:?Set NEXTCLOUD_IMAGE in .env}
    restart: on-failure:5
    mem_limit: 2g
    depends_on:
      nextcloud-postgres:
        condition: service_healthy
      nextcloud-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:80/tcp"
    environment:
      POSTGRES_HOST: nextcloud-postgres
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?Set NEXTCLOUD_DB_PASSWORD in .env}
      REDIS_HOST: nextcloud-redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:?Set NEXTCLOUD_ADMIN_USER in .env}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?Set NEXTCLOUD_ADMIN_PASSWORD in .env}
      NEXTCLOUD_TRUSTED_DOMAINS: ${TAILSCALE_FQDN:?Set TAILSCALE_FQDN in .env}
      TRUSTED_PROXIES: 172.16.0.0/12
      OVERWRITEHOST: ${TAILSCALE_FQDN}:8445
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: https://${TAILSCALE_FQDN}:8445
      PHP_MEMORY_LIMIT: 768M
      PHP_UPLOAD_LIMIT: 16G
    volumes:
      - ${DATA_DIR:?Set DATA_DIR in .env}/nextcloud/html:/var/www/html
      - ${MEDIA_DIR:?Set MEDIA_DIR in .env}/nextcloud:/var/www/html/data
    networks:
      # Separate from the generic web network so n8n cannot bypass the
      # read-only connector. Homepage and Uptime Kuma retain monitor access.
      - nextcloud-access
      - nextcloud-internal
    security_opt:
      - no-new-privileges:true

  nextcloud-readonly:
    image: ${NGINX_IMAGE:?Set NGINX_IMAGE in .env}
    restart: on-failure:5
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      - nextcloud
    environment:
      NEXTCLOUD_INTERNAL_HOST: ${TAILSCALE_FQDN:?Set TAILSCALE_FQDN in .env}
      # Preserve NGINX variables such as $remote_addr while substituting only
      # the trusted Nextcloud hostname in the mounted template.
      NGINX_ENVSUBST_FILTER: "^NEXTCLOUD_INTERNAL_HOST$$"
    volumes:
      - ./config/nextcloud-readonly/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - nextcloud-internal
      - ai-connectors
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget --quiet --tries=1 --spider http://127.0.0.1:8080/healthz &&
          wget --quiet --tries=1 --spider http://nextcloud/status.php
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  nextcloud-cron:
    image: ${NEXTCLOUD_IMAGE:?Set NEXTCLOUD_IMAGE in .env}
    restart: on-failure:5
    mem_limit: 384m
    depends_on:
      - nextcloud
    entrypoint: /cron.sh
    volumes:
      - ${DATA_DIR:?Set DATA_DIR in .env}/nextcloud/html:/var/www/html
      - ${MEDIA_DIR:?Set MEDIA_DIR in .env}/nextcloud:/var/www/html/data
    networks:
      - nextcloud-internal
    security_opt:
      - no-new-privileges:true

  jellyfin:
    image: ${JELLYFIN_IMAGE:?Set JELLYFIN_IMAGE in .env}
    restart: on-failure:5
    mem_limit: 2g
    cpus: 3.5
    user: "${PUID:?Set PUID in .env}:${PGID:?Set PGID in .env}"
    group_add:
      - "${RENDER_GID:?Set RENDER_GID in .env}"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    environment:
      TZ: ${TZ:-Europe/Rome}
      JELLYFIN_PublishedServerUrl: https://${TAILSCALE_FQDN:?Set TAILSCALE_FQDN in .env}:8446
    volumes:
      - ${DATA_DIR:?Set DATA_DIR in .env}/jellyfin/config:/config
      - ${DATA_DIR:?Set DATA_DIR in .env}/jellyfin/cache:/cache
      - ${MEDIA_DIR:?Set MEDIA_DIR in .env}/jellyfin:/media:ro
      # Same container path used by the downloader, so Jellyfin can index the
      # generated files without granting the downloader access to /media.
      - ${MEDIA_DIR:?Set MEDIA_DIR in .env}/downloads:/app/videos:ro
    ports:
      - "127.0.0.1:8096:8096/tcp"
    networks:
      - web
    security_opt:
      - no-new-privileges:true

  streamingcommunity:
    image: ${STREAMINGCOMMUNITY_IMAGE:?Set STREAMINGCOMMUNITY_IMAGE in .env}
    restart: on-failure:5
    mem_limit: 1536m
    cpus: 2.5
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      VIDEOS_DIR: /app/videos
      TMP_DIR: /app/tmp
      DB_FILE: /app/config/panel.db
      DATA_FILE: /app/config/data.json
      SCHEDULE_FILE: /app/config/schedule.json
      AUTH_ENABLED: "1"
      COOKIE_SECURE: "1"
      COOKIE_SAMESITE: lax
      # Requests arrive only through the host-controlled Tailscale proxy.
      TRUST_PROXY_HEADERS: "1"
    volumes:
      - ${DATA_DIR:?Set DATA_DIR in .env}/streamingcommunity:/app/config
      - ${MEDIA_DIR:?Set MEDIA_DIR in .env}/downloads:/app/videos
      - ${MEDIA_DIR:?Set MEDIA_DIR in .env}/downloads/.tmp:/app/tmp
    ports:
      - "127.0.0.1:8000:8000/tcp"
    networks:
      - web
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  lidarr:
    image: ${LIDARR_IMAGE:?Set LIDARR_IMAGE in .env}
    restart: on-failure:5
    mem_limit: 768m
    environment:
      PUID: ${PUID:?Set PUID in .env}
      PGID: ${PGID:?Set PGID in .env}
      TZ: ${TZ:-Europe/Rome}
      UMASK: "002"
    volumes:
      - ${DATA_DIR:?Set DATA_DIR in .env}/lidarr:/config
      # Lidarr owns the permanent library. Aurral v2 orchestrates optional
      # external download sources such as slskd without writing here directly.
      # The parent music directory is a verified mount below MEDIA_DIR.
      - type: bind
        source: ${MEDIA_DIR:?Set MEDIA_DIR in .env}/music
        target: /data
        bind:
          create_host_path: false
    ports:
      # Exposed only through host-controlled Tailscale Serve, never on the LAN.
      - "127.0.0.1:8686:8686/tcp"
    networks:
      - web
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - --max-time
        - "5"
        - http://127.0.0.1:8686/ping
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true

  slskd:
    image: ${SLSKD_IMAGE:?Set SLSKD_IMAGE in .env}
    restart: on-failure:5
    mem_limit: 768m
    user: "${PUID:?Set PUID in .env}:${PGID:?Set PGID in .env}"
    environment:
      # The Lidarr plugin may remove completed jobs after a successful import.
      # Remote configuration remains disabled below.
      SLSKD_REMOTE_FILE_MANAGEMENT: "true"
      SLSKD_REMOTE_CONFIGURATION: "false"
      # Lidarr and slskd share PUID/PGID; keep imported files group-writable.
      SLSKD_UMASK: "002"
      SLSKD_DOWNLOADS_DIR: /data/.downloads/slskd/complete
      SLSKD_INCOMPLETE_DIR: /data/.downloads/slskd/incomplete
      SLSKD_SLSK_USERNAME: ${SLSKD_SLSK_USERNAME:?Set SLSKD_SLSK_USERNAME in .env}
      SLSKD_SLSK_PASSWORD: ${SLSKD_SLSK_PASSWORD:?Set SLSKD_SLSK_PASSWORD in .env}
      SLSKD_USERNAME: ${SLSKD_WEB_USERNAME:?Set SLSKD_WEB_USERNAME in .env}
      SLSKD_PASSWORD: ${SLSKD_WEB_PASSWORD:?Set SLSKD_WEB_PASSWORD in .env}
      SLSKD_API_KEY: ${SLSKD_API_KEY:?Set SLSKD_API_KEY in .env}
      SLSKD_JWT_KEY: ${SLSKD_JWT_KEY:?Set SLSKD_JWT_KEY in .env}
      SLSKD_DISK_LOGGER: "false"
    volumes:
      - ${DATA_DIR:?Set DATA_DIR in .env}/slskd:/app
      - type: bind
        source: ${MEDIA_DIR:?Set MEDIA_DIR in .env}/music/.downloads/slskd
        target: /data/.downloads/slskd
        bind:
          create_host_path: false
    ports:
      # Web UI/API are exposed only through host-controlled Tailscale Serve.
      - "127.0.0.1:5030:5030/tcp"
      # Port 50300 is intentionally not published. See docs/music-stack.md
      # before enabling public Soulseek inbound connectivity.
    networks:
      - web
    # Upstream ships the same /health probe but with a one-hour start period.
    # This shorter override makes Docker/Homepage useful after a normal boot.
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:5030/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    security_opt:
      - no-new-privileges:true

  navidrome:
    image: ${NAVIDROME_IMAGE:?Set NAVIDROME_IMAGE in .env}
    restart: on-failure:5
    mem_limit: 768m
    user: "${PUID:?Set PUID in .env}:${PGID:?Set PGID in .env}"
    environment:
      ND_DATAFOLDER: /config
      ND_CACHEFOLDER: /cache
      ND_MUSICFOLDER: /data/library
      ND_SCANNER_PURGEMISSING: always
      ND_ENABLEINSIGHTSCOLLECTOR: "false"
      ND_LOGLEVEL: info
      # Required only to enable per-user Last.fm scrobbling in the Navidrome UI.
      ND_LASTFM_APIKEY: ${NAVIDROME_LASTFM_API_KEY:-}
      ND_LASTFM_SECRET: ${NAVIDROME_LASTFM_SECRET:-}
    volumes:
      - ${DATA_DIR:?Set DATA_DIR in .env}/navidrome:/config
      - ${DATA_DIR:?Set DATA_DIR in .env}/navidrome-cache:/cache
      - type: bind
        source: ${MEDIA_DIR:?Set MEDIA_DIR in .env}/music
        target: /data
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:4533:4533/tcp"
    networks:
      - web
    security_opt:
      - no-new-privileges:true

  aurral:
    image: ${AURRAL_IMAGE:?Set AURRAL_IMAGE in .env}
    restart: on-failure:5
    mem_limit: 1g
    # Avoid the host/Pi-hole startup DNS loop for external Soulseek and
    # metadata lookups. Docker's embedded DNS still resolves service names.
    dns:
      - 9.9.9.9
      - 149.112.112.112
    depends_on:
      - lidarr
      - slskd
      - navidrome
    environment:
      PUID: ${PUID:?Set PUID in .env}
      PGID: ${PGID:?Set PGID in .env}
      AURRAL_DATA_DIR: /config
      # Initial v2 output path; it remains editable under Download Clients.
      DOWNLOAD_FOLDER: /data/aurral
      TRUST_PROXY: "true"
      AURRAL_IMAGE_PROXY_MAX_BYTES: "67108864"
    volumes:
      - ${DATA_DIR:?Set DATA_DIR in .env}/aurral:/config
      # The permanent library is read-only. Nested writable mounts allow
      # Aurral to write only its own output and consume completed slskd jobs.
      - type: bind
        source: ${MEDIA_DIR:?Set MEDIA_DIR in .env}/music
        target: /data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_DIR:?Set MEDIA_DIR in .env}/music/aurral
        target: /data/aurral
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_DIR:?Set MEDIA_DIR in .env}/music/.downloads/slskd/complete
        target: /data/.downloads/slskd/complete
        bind:
          create_host_path: false
    ports:
      # Host port 3001 is already used by Uptime Kuma.
      - "127.0.0.1:3002:3001/tcp"
    networks:
      - web
    # A running Node process is not enough: this endpoint detects the exact
    # failure mode where Aurral accepts TCP connections but its event loop no
    # longer answers HTTP requests.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/api/health/live',
          {signal:AbortSignal.timeout(5000)})
          .then(r=>process.exit(r.ok?0:1))
          .catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  immich-postgres:
    image: ${IMMICH_POSTGRES_IMAGE:?Set IMMICH_POSTGRES_IMAGE in .env}
    restart: on-failure:5
    mem_limit: 2g
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD:?Set IMMICH_DB_PASSWORD in .env}
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - ${DATA_DIR:?Set DATA_DIR in .env}/immich/postgres:/var/lib/postgresql/data
    networks:
      - immich-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich -d immich"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  immich-redis:
    image: ${IMMICH_REDIS_IMAGE:?Set IMMICH_REDIS_IMAGE in .env}
    restart: on-failure:5
    mem_limit: 256m
    networks:
      - immich-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  immich-server:
    image: ${IMMICH_SERVER_IMAGE:?Set IMMICH_SERVER_IMAGE in .env}
    restart: on-failure:5
    mem_limit: 3g
    cpus: 3.0
    depends_on:
      immich-postgres:
        condition: service_healthy
      immich-redis:
        condition: service_healthy
    devices:
      - /dev/dri:/dev/dri
    environment:
      TZ: ${TZ:-Europe/Rome}
      DB_HOSTNAME: immich-postgres
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
      IMMICH_HELMET_FILE: "true"
      CPU_CORES: "3"
    volumes:
      - ${MEDIA_DIR:?Set MEDIA_DIR in .env}/immich:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:2283:2283/tcp"
    networks:
      - web
      - immich-internal
    healthcheck:
      disable: false
    security_opt:
      - no-new-privileges:true

networks:
  nextcloud-access:
  nextcloud-internal:
    internal: true
  ai-connectors:
    internal: true
  immich-internal:
    internal: true
