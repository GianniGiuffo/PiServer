- Sistema rack:
    - Server:
        id: rack-system-server
        widget:
          type: customapi
          url: http://monitoring-api:8080/server
          refreshInterval: 5000
          mappings:
            - field: cpu_percent
              label: CPU
              format: percent
            - field: memory_percent
              label: Memoria
              format: percent
            - field: temperature_c
              label: Temperatura
              format: float
              suffix: " °C"
            - field: uptime_seconds
              label: Uptime
              format: duration
    - NAS:
        id: rack-system-nas
        widget:
          type: customapi
          url: http://monitoring-api:8080/nas
          refreshInterval: 10000
          mappings:
            - field: status
              label: Stato
            - field: free_bytes
              label: Liberi
              format: bytes
            - field: total_bytes
              label: Totali
              format: bytes
            - field: used_percent
              label: Utilizzo
              format: percent
    - Rete:
        id: rack-system-network
        widget:
          type: customapi
          url: http://monitoring-api:8080/network
          refreshInterval: 5000
          mappings:
            - field: interface
              label: Interfaccia
            - field: rx_bps
              label: Entrata
              format: bitrate
            - field: tx_bps
              label: Uscita
              format: bitrate
    - Backup:
        id: rack-system-backup
        widget:
          type: customapi
          url: http://monitoring-api:8080/backup
          refreshInterval: 15000
          mappings:
            - field: status
              label: Stato
            - field: last_success
              label: Ultimo
              format: relativeDate
              locale: it
              style: short
              numeric: auto
            - field: next_run
              label: Prossimo
              format: relativeDate
              locale: it
              style: short
              numeric: auto
            - field: duration_seconds
              label: Durata
              format: duration

- Servizi rack:
    - Pi-hole secondario:
        icon: pi-hole.png
        href: https://{{HOMEPAGE_VAR_RACK_PI_FQDN}}:8444/admin/
        siteMonitor: http://pihole/admin/
        description: DNS replica LAN e Tailnet
        server: local
        container: rack-pi-pihole-1
    - Uptime Kuma rack:
        icon: uptime-kuma.png
        href: https://{{HOMEPAGE_VAR_RACK_PI_FQDN}}:8448/
        siteMonitor: http://uptime-kuma:3001/
        description: Monitoraggio del mini PC
        server: local
        container: rack-pi-uptime-kuma-1
    - Replica Pi-hole:
        icon: mdi-database-sync
        description: Sincronizzazione ogni 15 minuti
        server: local
        container: rack-pi-nebula-sync-1
    - Repository Restic:
        icon: mdi-backup-restore
        description: Endpoint append-only sulla Tailnet
        server: local
        container: rack-pi-rest-server-1

