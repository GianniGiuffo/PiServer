# Optional automation services for the Debian amd64 mini PC.
# Start through systemd after the core stack:
#   sudo systemctl enable --now automation-stack.service

services:
  n8n-postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE in .env}
    restart: on-failure:5
    # Also stores the Postgres Chat Memory table used by the AI workflow.
    mem_limit: 1g
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD in .env}
    volumes:
      - ${DATA_DIR:?Set DATA_DIR in .env}/n8n/postgres:/var/lib/postgresql/data
    networks:
      - automation
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  ollama:
    image: ${OLLAMA_IMAGE:?Set OLLAMA_IMAGE in .env}
    restart: on-failure:5
    # The i5-7500 has no suitable GPU. Do not publish port 11434: only n8n on
    # the internal network can call the local model service.
    # qwen3.5:4b is a 3.4 GB Q4 model. Runtime state and its bounded 8K
    # context require additional headroom on this 16 GB CPU-only host.
    mem_limit: 6g
    cpus: 3.5
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    volumes:
      - ${DATA_DIR:?Set DATA_DIR in .env}/ollama:/root/.ollama
    networks:
      # n8n reaches Ollama only over the internal network. The separate
      # egress network provides a default route solely so Ollama can download
      # explicitly requested models; it has no published host ports and no
      # other attached services.
      automation:
        gw_priority: 0
      ollama-egress:
        gw_priority: 1
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Docker health only: confirm that the Ollama process answers its local
      # CLI. Model availability is intentionally not used as a health signal.
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Pull the selected local model before n8n starts. Re-running this one-shot
  # service is idempotent: Ollama only downloads layers that are not present.
  ollama-model-init:
    image: ${OLLAMA_IMAGE:?Set OLLAMA_IMAGE in .env}
    restart: "no"
    mem_limit: 256m
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen3.5:4b}"]
    networks:
      - automation
    security_opt:
      - no-new-privileges:true

  searxng:
    image: ${SEARXNG_IMAGE:?Set SEARXNG_IMAGE in .env}
    restart: on-failure:5
    mem_limit: 512m
    cpus: 1.0
    environment:
      TZ: ${TZ:-Europe/Rome}
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env}
      SEARXNG_PORT: 8080
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./config/searxng:/etc/searxng:ro
      - ${DATA_DIR:?Set DATA_DIR in .env}/searxng/cache:/var/cache/searxng
    networks:
      # n8n can use the JSON search API only through the private connector
      # network. The second network provides outbound access to search engines.
      ai-connectors:
        gw_priority: 0
      searxng-egress:
        gw_priority: 1
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - wget --quiet --tries=1 --spider http://127.0.0.1:8080/healthz
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    security_opt:
      - no-new-privileges:true

  n8n:
    image: ${N8N_IMAGE:?Set N8N_IMAGE in .env}
    restart: on-failure:5
    # Leave room for AI Agent execution, Postgres memory and tool payloads.
    mem_limit: 2g
    depends_on:
      n8n-postgres:
        condition: service_healthy
      ollama-model-init:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-Europe/Rome}
      GENERIC_TIMEZONE: ${TZ:-Europe/Rome}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD in .env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: ${TAILSCALE_FQDN:?Set TAILSCALE_FQDN in .env}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      N8N_EDITOR_BASE_URL: https://${TAILSCALE_FQDN}:8449/
      WEBHOOK_URL: https://${N8N_WEBHOOK_DOMAIN:?Set N8N_WEBHOOK_DOMAIN in .env}:8449/
      N8N_PROXY_HOPS: 1
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336
    volumes:
      - ${DATA_DIR:?Set DATA_DIR in .env}/n8n/n8n:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678/tcp"
    networks:
      - web
      - automation
      - ai-connectors
      - ai-ops
    security_opt:
      - no-new-privileges:true

  # The root gateway listens only on a host Unix socket. This unprivileged
  # bridge exposes it solely to n8n on an internal Docker network.
  ai-ops-bridge:
    image: ${MONITORING_API_IMAGE:?Set MONITORING_API_IMAGE in .env}
    restart: on-failure:5
    mem_limit: 64m
    user: "${PUID:-1000}:${PGID:-1000}"
    command: ["python", "/app/ai-ops-bridge.py"]
    environment:
      AI_OPS_SOCKET: /run/ai-ops/gateway.sock
    volumes:
      - ./scripts/ai-ops-bridge.py:/app/ai-ops-bridge.py:ro
      - /run/piserver-ai-ops:/run/ai-ops:ro
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - ai-ops
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Telegram is polled outbound, so the n8n webhook remains private. The bot
  # token and bridge token are root-managed files, never Compose variables.
  ai-ops-telegram:
    image: ${MONITORING_API_IMAGE:?Set MONITORING_API_IMAGE in .env}
    restart: on-failure:5
    mem_limit: 96m
    user: "${PUID:-1000}:${PGID:-1000}"
    command: ["python", "/app/ai-ops-telegram.py"]
    environment:
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/bot-token
      TELEGRAM_BRIDGE_TOKEN_FILE: /run/secrets/bridge-token
      AI_OPS_APPROVAL_TOKEN_FILE: /run/secrets/approval-token
      TELEGRAM_OFFSET_FILE: /state/offset
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/piserver-ai-ops-telegram-v1
      AI_OPS_GATEWAY_URL: http://ai-ops-bridge:8080
      AI_OPS_TELEGRAM_CHAT_ID: ${AI_OPS_TELEGRAM_CHAT_ID:-disabled}
      AI_OPS_TELEGRAM_USER_ID: ${AI_OPS_TELEGRAM_USER_ID:-disabled}
    volumes:
      - ./scripts/ai-ops-telegram.py:/app/ai-ops-telegram.py:ro
      - /etc/raspberry-server/ai-ops-telegram-bot-token:/run/secrets/bot-token:ro
      - /etc/raspberry-server/ai-ops-telegram-bridge-token:/run/secrets/bridge-token:ro
      - /etc/raspberry-server/ai-ops-approval-token:/run/secrets/approval-token:ro
      - ${DATA_DIR:?Set DATA_DIR in .env}/n8n/ai-ops-telegram:/state
    read_only: true
    networks:
      automation:
        gw_priority: 0
      ai-ops:
        gw_priority: 0
      telegram-egress:
        gw_priority: 1
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  automation:
    internal: true
  ai-connectors:
    internal: true
  ai-ops:
    internal: true
  ollama-egress:
  searxng-egress:
  telegram-egress:
