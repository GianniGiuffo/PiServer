# Optional automation services for the Debian amd64 mini PC.
# Start through systemd after the core stack:
#   sudo systemctl enable --now automation-stack.service

services:
  n8n-postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE in .env}
    restart: on-failure:5
    # Also stores the Postgres Chat Memory table used by the AI workflow.
    mem_limit: 1g
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD in .env}
    volumes:
      - ${DATA_DIR:?Set DATA_DIR in .env}/n8n/postgres:/var/lib/postgresql/data
    networks:
      - automation
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  searxng:
    image: ${SEARXNG_IMAGE:?Set SEARXNG_IMAGE in .env}
    restart: on-failure:5
    mem_limit: 512m
    cpus: 1.0
    environment:
      TZ: ${TZ:-Europe/Rome}
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env}
      SEARXNG_PORT: 8080
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./config/searxng:/etc/searxng:ro
      - ${DATA_DIR:?Set DATA_DIR in .env}/searxng/cache:/var/cache/searxng
    networks:
      # n8n can use the JSON search API only through the private connector
      # network. The second network provides outbound access to search engines.
      ai-connectors:
        gw_priority: 0
      searxng-egress:
        gw_priority: 1
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - wget --quiet --tries=1 --spider http://127.0.0.1:8080/healthz
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    security_opt:
      - no-new-privileges:true

  n8n:
    image: ${N8N_IMAGE:?Set N8N_IMAGE in .env}
    restart: on-failure:5
    # Leave room for AI Agent execution, Postgres memory and tool payloads.
    mem_limit: 2g
    depends_on:
      n8n-postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Rome}
      GENERIC_TIMEZONE: ${TZ:-Europe/Rome}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD in .env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: ${TAILSCALE_FQDN:?Set TAILSCALE_FQDN in .env}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      N8N_EDITOR_BASE_URL: https://${TAILSCALE_FQDN}:8449/
      WEBHOOK_URL: https://${N8N_WEBHOOK_DOMAIN:?Set N8N_WEBHOOK_DOMAIN in .env}:8449/
      N8N_PROXY_HOPS: 1
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336
    volumes:
      - ${DATA_DIR:?Set DATA_DIR in .env}/n8n/n8n:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678/tcp"
    networks:
      - web
      - automation
      - ai-connectors
    security_opt:
      - no-new-privileges:true

networks:
  automation:
    internal: true
  ai-connectors:
    internal: true
  searxng-egress:
